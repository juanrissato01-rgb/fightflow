<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a09">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FightFlow">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="FightFlow: gestão de alunos, mensalidades e cobranças para academias de luta.">
<title>FightFlow</title>
<link rel="icon" id="fav"><link rel="apple-touch-icon" id="ati">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0a09;--side:#0d0d0c;--card:#151514;--card2:#1e1d1b;--line:#2a2927;--ink:#f6f6f2;--mute:#9a988d;--blue:#3b6fd8;--yel:#f7c600;--ok:#2fb36a;--warn:#f7c600;--bad:#f0584d;--nav-h:64px;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 400px at 80% -10%,#19603a40,transparent) no-repeat;color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,a,input,select,textarea,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;min-height:100dvh}
aside{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:4px 10px 20px;letter-spacing:-.02em}.logo img{width:34px;height:34px;border-radius:8px;flex:none}.logo i{color:var(--yel);font-style:normal}
nav button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:8px;color:var(--mute);cursor:pointer;margin-bottom:2px;transition:.15s}
nav button:hover{background:var(--card);color:var(--ink)}nav button.on{background:var(--card2);color:var(--ink);box-shadow:inset 2px 0 0 var(--yel)}
nav button:focus-visible{outline:2px solid var(--blue)}
nav svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .s{display:none}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line)}
.hl{display:flex;align-items:center;gap:10px;min-width:0}.hl img{display:none;width:30px;height:30px;border-radius:7px;flex:none}
#acad{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:10px;flex:none}.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#19603a,#0a2314);display:grid;place-items:center;font-weight:600;font-size:12px}
#alertN:not(:empty){background:#f0584d22;color:var(--bad);font-weight:600;padding:2px 9px;border-radius:99px;font-size:12px}
main{padding:24px 28px 60px;max-width:1180px;width:100%}h1{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 8px 24px #0004;min-width:0}
.k{color:var(--mute);font-size:12px}.v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-bottom:12px}
h2{font-size:14px;margin:0 0 12px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row>div:first-child{min-width:0}.row b{font-weight:600;overflow-wrap:anywhere}.m{color:var(--mute);font-size:12.5px}
.tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;line-height:1.4;align-self:center}
.paid{background:#2fb36a22;color:var(--ok)}.soon{background:#f7c60022;color:var(--warn)}.late{background:#f0584d22;color:var(--bad)}.pending{background:#3b6fd824;color:#6b95ea}.canceled{background:#8593a826;color:var(--mute)}
button.b,a.b{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;transition:.15s;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.b:hover{border-color:#4a4638;transform:translateY(-1px)}.b:active{transform:none}.pri{background:var(--yel)!important;border-color:var(--yel)!important;color:#111!important;font-weight:700!important}.wa{background:#2fb36a22!important;border-color:#2fb36a66!important;color:var(--ok)!important}.dng{color:var(--bad)!important}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#0d0d0c;border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs .b.on{background:var(--yel);border-color:var(--yel);color:#111}
.empty{text-align:center;color:var(--mute);padding:36px 12px}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(560px,94vw);max-height:90vh;max-height:90dvh;overflow-y:auto;box-shadow:0 30px 80px #000a}dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}
.dlg-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g .f{grid-column:1/-1}
.sw{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;margin:0;font-size:14px;color:var(--ink)}.sw input{width:18px;height:18px;min-height:0;accent-color:var(--yel)}
.prev{background:#0d0d0c;border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid #22c55e}
.chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:20px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .trk{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:0}.chart .bar{width:100%;max-width:46px;background:var(--yel);border-radius:6px 6px 3px 3px;min-height:2px}
.chart .val{font-size:10.5px;color:var(--ink);margin-bottom:4px;white-space:nowrap}.chart .lb{font-size:11px;color:var(--mute);margin-top:6px}
#toast{position:fixed;bottom:calc(20px + var(--sab));left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:calc(100vw - 32px);text-align:center}#toast.on{opacity:1}
.note{background:#f7c60014;border:1px solid #f7c60055;color:#f7c600;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px}
@media(min-width:1500px){main{margin:0 auto}}
@media(max-width:1024px) and (min-width:821px){.app{grid-template-columns:200px minmax(0,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:820px){
  body{font-size:15px}
  .app{display:block;padding-bottom:calc(var(--nav-h) + var(--sab))}
  aside{position:fixed;z-index:20;left:0;right:0;bottom:0;top:auto;height:auto;padding:0 var(--sar) var(--sab) var(--sal);border-right:0;border-top:1px solid var(--line);background:#0d0d0cf2;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:visible}
  .logo{display:none}
  nav{display:flex;height:var(--nav-h)}
  nav button{flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:3px;padding:6px 2px;margin:0;border-radius:0;font-size:10.5px;font-weight:500;text-align:center}
  nav button svg{width:21px;height:21px}
  nav button:hover{background:none}
  nav button.on{background:none;box-shadow:inset 0 2px 0 var(--yel);color:var(--yel)}
  nav .t{display:none}nav .s{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header{position:sticky;top:0;z-index:10;padding:calc(10px + var(--sat)) calc(16px + var(--sar)) 10px calc(16px + var(--sal));background:#0a0a09e6;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .hl img{display:block}
  .av{display:none}
  main{padding:18px calc(16px + var(--sar)) 28px calc(16px + var(--sal))}
  h1{font-size:21px}.sub{margin-bottom:16px;font-size:13.5px}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:14px;border-radius:13px}
  .v{font-size:21px}
  .two,.g{grid-template-columns:1fr}
  .row{flex-wrap:wrap;padding:13px 0}
  .row>div:first-child{flex:1 1 55%}
  .row>.acts:has(.b){flex:1 1 100%;justify-content:flex-start}
  .row>.acts .b{flex:1 1 auto}
  button.b,a.b{min-height:42px;padding:9px 14px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}.tabs .b{flex:none;min-height:38px}
  input,select,textarea{font-size:16px;min-height:46px}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;border-bottom:0;padding:20px 16px 0;max-height:92dvh}
  dialog[open]{animation:up .22s ease-out}
  .dlg-acts{position:sticky;bottom:0;background:var(--card);margin:16px -16px 0;padding:12px 16px calc(12px + var(--sab));border-top:1px solid var(--line)}
  .dlg-acts .b{flex:1}
  .chart{height:160px;gap:6px}
  .card>.b,.card>button{margin-bottom:6px}
  #toast{bottom:calc(var(--nav-h) + 14px + var(--sab))}
}
@media(max-width:360px){.cards{grid-template-columns:1fr}nav button{font-size:9.5px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{aside,header,#toast,.b{display:none!important}.app{display:block}body{background:#fff;color:#000}.card{box-shadow:none;border-color:#ccc;background:#fff}}
</style>
</head>

<script>
const DEF="Olá, {nome}! Tudo bem? 🥊\n\nPassando para lembrar que sua mensalidade de {modalidade} no valor de R$ {valor} vence no dia {vencimento}.\n\nNão esqueça de realizar o pagamento para continuar treinando normalmente!\n\nQualquer dúvida, estamos à disposição.\n{nome_academia}";
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
let S=ld('ff:s',[]),P=ld('ff:p',[]),L=ld('ff:l',[]),C=ld('ff:c',{academia:'CBDAM',pix:'',tpl:DEF,rules:{'-3':true,'0':true,'2':true,'5':true}});
const sv=()=>{try{localStorage.setItem('ff:s',JSON.stringify(S));localStorage.setItem('ff:p',JSON.stringify(P));localStorage.setItem('ff:l',JSON.stringify(L));localStorage.setItem('ff:c',JSON.stringify(C))}catch(e){}};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=s=>new Date(s+'T00:00:00'),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=s=>D(s).toLocaleDateString('pt-BR'),R=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const todayS=()=>iso(new Date()),diff=s=>Math.round((D(s)-D(todayS()))/864e5);
function addM(s,n){const d=D(s),day=d.getDate(),r=new Date(d.getFullYear(),d.getMonth()+n,1);r.setDate(Math.min(day,new Date(r.getFullYear(),r.getMonth()+1,0).getDate()));return iso(r)}
const PL={Mensal:1,Trimestral:3,Semestral:6,Anual:12,Personalizado:1};
const stu=id=>S.find(s=>s.id===id);
function st(p){const s=stu(p.sid);if(p.paidAt)return['paid','Paga'];if(!s||s.status==='pausado')return['canceled','Cancelada'];const d=diff(p.due);if(d<0)return['late','Atrasada '+(-d)+'d'];if(d===0)return['soon','Vence hoje'];if(d<=3)return['soon','Vence em '+d+'d'];return['pending','Pendente']}
const tag=p=>{const[c,t]=st(p);return`<span class="tag ${c}">${t}</span>`};
function msg(p){const s=stu(p.sid);return C.tpl.replaceAll('{nome}',s.nome.split(' ')[0]).replaceAll('{modalidade}',s.mod).replaceAll('{valor}',Number(p.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})).replaceAll('{vencimento}',fd(p.due)).replaceAll('{nome_academia}',C.academia).replaceAll('{pix}',C.pix||'')}
function wa(p,rule){const s=stu(p.sid);let t=s.tel.replace(/\D/g,'');if(t.length<=11)t='55'+t;return`<a class="b wa" target="_blank" rel="noopener" data-log="${p.id}|${rule??'manual'}" href="https://wa.me/${t}?text=${encodeURIComponent(msg(p))}">WhatsApp</a>`}
function toast(t){const e=$('#toast');e.textContent=t;e.className='on';setTimeout(()=>e.className='',2200)}
const ICON={dashboard:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',alunos:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',mensalidades:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',cobrancas:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',automacoes:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',relatorios:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',config:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'};
const NAV=[['dashboard','Dashboard','Início'],['alunos','Alunos','Alunos'],['mensalidades','Mensalidades','Mensal.'],['cobrancas','Cobranças','Cobrar'],['automacoes','Automações','Regras'],['relatorios','Relatórios','Relatór.'],['config','Configurações','Ajustes']];
let view='dashboard',filt='todas';
const empty=(t,s,b)=>`<div class="empty"><b>${t}</b>${s}${b?`<div style="margin-top:14px">${b}</div>`:''}</div>`;
const addBtn='<button class="b pri" data-a="new">+ Cadastrar aluno</button>';
const open=()=>P.filter(p=>!p.paidAt&&stu(p.sid)?.status==='ativo');

function dash(){
  const ativos=S.filter(s=>s.status==='ativo'),m=todayS().slice(0,7),mp=P.filter(p=>stu(p.sid)?.status==='ativo'&&p.due.slice(0,7)===m);
  const prev=ativos.reduce((a,s)=>a+Number(s.valor),0),pagas=P.filter(p=>p.paidAt&&p.paidAt.slice(0,7)===m).length;
  const pend=open().filter(p=>diff(p.due)>=0),soon=pend.filter(p=>diff(p.due)<=3),late=open().filter(p=>diff(p.due)<0);
  const K=(k,v,c='')=>`<div class="card"><div class="k">${k}</div><div class="v" style="${c}">${v}</div></div>`;
  const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i,1);return iso(d).slice(0,7)}),vals=months.map(k=>P.filter(p=>p.paidAt&&p.paidAt.slice(0,7)===k).reduce((a,p)=>a+Number(p.valor),0)),mx=Math.max(...vals,1);
  const chart=vals.some(x=>x)?`<div class="chart">${vals.map((x,i)=>`<div class="col"><div class="trk"><div class="val">${x?R(x).replace(',00',''):''}</div><div class="bar" style="height:${x?Math.max(x/mx*82,3):0}%"></div></div><div class="lb">${months[i].slice(5)}/${months[i].slice(2,4)}</div></div>`).join('')}</div>`:`<div class="empty">Os pagamentos que você marcar aparecerão aqui.</div>`;
  const next=[...open()].filter(p=>diff(p.due)>=0).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6);
  return`<h1>Dashboard</h1><p class="sub">Visão geral de ${esc(C.academia)}</p>
  <div class="cards">${K('Alunos ativos',ativos.length)}${K('Receita prevista/mês',R(prev))}${K('Pagas no mês',pagas,'color:var(--ok)')}${K('Pendentes',pend.length)}${K('Vencendo em 3 dias',soon.length,'color:var(--warn)')}${K('Inadimplentes',new Set(late.map(p=>p.sid)).size,'color:var(--bad)')}</div>
  <div class="two"><div class="card"><h2>Receita recebida (6 meses)</h2>${chart}</div>
  <div class="card"><h2>Atenção necessária</h2>${late.length?late.map(p=>`<div class="row"><div><b>${esc(stu(p.sid).nome)}</b><div class="m">${R(p.valor)} · venceu ${fd(p.due)}</div></div><div class="acts">${tag(p)}${wa(p)}</div></div>`).join(''):empty('Tudo em dia','Nenhum aluno atrasado.')}</div></div>
  <div class="card"><h2>Próximos vencimentos</h2>${next.length?next.map(p=>`<div class="row"><div><b>${esc(stu(p.sid).nome)}</b><div class="m">${esc(stu(p.sid).mod)} · ${R(p.valor)} · ${fd(p.due)}</div></div><div class="acts">${tag(p)}${wa(p)}<button class="b" data-a="pay" data-id="${p.id}">Marcar como pago</button></div></div>`).join(''):empty('Sem vencimentos','Cadastre um aluno para começar.',addBtn)}</div>`}

function alunos(){return`<h1>Alunos</h1><p class="sub">${S.length} cadastrados</p><div style="margin-bottom:14px">${addBtn}</div><div class="card">${S.length?S.map(s=>`<div class="row"><div><b>${esc(s.nome)}</b> ${s.status==='pausado'?'<span class="tag canceled">Pausado</span>':''}<div class="m">${esc(s.mod)} · ${esc(s.plano)} · ${R(s.valor)} · desde ${fd(s.entrada)}</div></div><div class="acts"><button class="b" data-a="edit" data-id="${s.id}">Editar</button><button class="b" data-a="tog" data-id="${s.id}">${s.status==='ativo'?'Pausar':'Reativar'}</button><button class="b dng" data-a="del" data-id="${s.id}">Excluir</button></div></div>`).join(''):empty('Nenhum aluno ainda','Cadastre o primeiro em menos de um minuto.',addBtn)}</div>`}

function mens(){
  const F={todas:()=>1,pagas:p=>p.paidAt,pendentes:p=>st(p)[0]==='pending',breve:p=>st(p)[0]==='soon',atrasadas:p=>st(p)[0]==='late',canceladas:p=>st(p)[0]==='canceled'};
  const lab={todas:'Todas',pagas:'Pagas',pendentes:'Pendentes',breve:'Vencendo em breve',atrasadas:'Atrasadas',canceladas:'Canceladas'};
  const rows=P.filter(p=>stu(p.sid)&&F[filt](p)).sort((a,b)=>b.due.localeCompare(a.due));
  return`<h1>Mensalidades</h1><p class="sub">Uma mensagem enviada não conta como pagamento.</p><div class="tabs">${Object.keys(lab).map(k=>`<button class="b ${k===filt?'on':''}" data-f="${k}">${lab[k]}</button>`).join('')}</div>
  <div class="card">${rows.length?rows.map(p=>`<div class="row"><div><b>${esc(stu(p.sid).nome)}</b><div class="m">${R(p.valor)} · vence ${fd(p.due)}${p.paidAt?' · pago em '+fd(p.paidAt):''}</div>${p.h?.length?`<div class="m">Histórico: ${esc(p.h.join(' → '))}</div>`:''}</div><div class="acts">${tag(p)}${p.paidAt?'':wa(p)+`<button class="b" data-a="pay" data-id="${p.id}">Marcar como pago</button>`}</div></div>`).join(''):empty('Nada por aqui','Nenhuma mensalidade nesta categoria.')}</div>`}

function rulesDue(){const out=[];open().forEach(p=>{const d=diff(p.due);Object.keys(C.rules).forEach(r=>{if(C.rules[r]&&-d===Number(r)&&!L.some(l=>l.pid===p.id&&l.rule===r))out.push([p,r])})});return out}
function cobr(){const q=rulesDue();return`<h1>Cobranças</h1><p class="sub">Fila de lembretes de hoje, sem duplicar quem já foi avisado.</p><div class="card" style="margin-bottom:12px"><h2>Para avisar hoje</h2>${q.length?q.map(([p,r])=>`<div class="row"><div><b>${esc(stu(p.sid).nome)}</b><div class="m">${R(p.valor)} · vence ${fd(p.due)} · regra ${RL[r]}</div></div>${wa(p,r)}</div>`).join(''):empty('Fila vazia','Ninguém precisa de lembrete agora.')}</div>
  <div class="card"><h2>Histórico de mensagens</h2>${L.length?[...L].reverse().slice(0,40).map(l=>`<div class="row"><div><b>${esc(l.nome)}</b><div class="m">${new Date(l.at).toLocaleString('pt-BR')} · ${esc(l.rule==='manual'?'manual':RL[l.rule])}</div></div><span class="tag pending">WhatsApp aberto</span></div>`).join(''):empty('Sem registros','Os envios aparecem aqui.')}<p class="m">Sem API conectada, o sistema registra que o WhatsApp foi aberto, não que a mensagem foi entregue.</p></div>`}
const RL={'-3':'3 dias antes','0':'no vencimento','2':'2 dias após','5':'5 dias após'};

function auto(){const p=open()[0]||{sid:'x'};let pv='Cadastre um aluno para ver a pré-visualização.';if(stu(p.sid))pv=msg(p);
  return`<h1>Automações</h1><p class="sub">Regras de lembrete e mensagem personalizada</p><div class="note">API oficial do WhatsApp ainda não conectada. Nada é enviado automaticamente: os lembretes aparecem em Cobranças com o botão que abre o WhatsApp.</div>
  <div class="two"><div class="card"><h2>Quando avisar</h2>${['-3','0','2','5'].map(r=>`<label class="sw"><input type="checkbox" data-r="${r}" ${C.rules[r]?'checked':''}> ${RL[r][0].toUpperCase()+RL[r].slice(1)}</label>`).join('')}<h2 style="margin-top:16px">Mensagem</h2><textarea id="tpl" rows="10">${esc(C.tpl)}</textarea><p class="m">Variáveis: {nome} {modalidade} {valor} {vencimento} {nome_academia}</p></div>
  <div class="card"><h2>Pré-visualização</h2><div class="prev" id="pv">${esc(pv)}</div></div></div>`}

function rel(){const m=todayS().slice(0,7),rec=P.filter(p=>p.paidAt).reduce((a,p)=>a+Number(p.valor),0),pen=open().reduce((a,p)=>a+Number(p.valor),0),inad=new Set(open().filter(p=>diff(p.due)<0).map(p=>p.sid)).size;
  return`<h1>Relatórios</h1><p class="sub">Calculados a partir dos pagamentos que você registrou</p><div class="cards"><div class="card"><div class="k">Total recebido</div><div class="v" style="color:var(--ok)">${R(rec)}</div></div><div class="card"><div class="k">Total pendente</div><div class="v">${R(pen)}</div></div><div class="card"><div class="k">Inadimplentes</div><div class="v" style="color:var(--bad)">${inad}</div></div></div><div class="card"><h2>Exportar</h2><button class="b pri" data-a="csv">Baixar CSV</button> <button class="b" onclick="window.print()">Salvar PDF (imprimir)</button></div>`}
function cfg(){return`<h1>Configurações</h1><p class="sub">Dados da academia</p><div class="card" style="max-width:480px"><label>Nome da academia</label><input id="ac" value="${esc(C.academia)}"><div style="height:12px"></div><label>Chave Pix (opcional, variável {pix})</label><input id="px" value="${esc(C.pix)}"><div style="margin-top:14px"><button class="b pri" data-a="savecfg">Salvar</button> <button class="b dng" data-a="reset">Apagar todos os dados</button></div></div>`}

function formAluno(id){const s=id?stu(id):{status:'ativo',entrada:todayS(),mod:'Muay Thai',plano:'Mensal',forma:'Pix'};const pp=id&&P.find(p=>p.sid===id&&!p.paidAt);
  const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
  $('#dlg').innerHTML=`<h2 style="font-size:18px">${id?'Editar aluno':'Novo aluno'}</h2><div class="g">
  <div class="f"><label>Nome completo</label><input id="fn" value="${esc(s.nome)}"></div><div><label>WhatsApp (com DDD)</label><input id="ft" inputmode="tel" value="${esc(s.tel)}"></div><div><label>Nascimento (opcional)</label><input id="fb" type="date" value="${s.nasc||''}"></div>
  <div><label>Data de entrada</label><input id="fe" type="date" value="${s.entrada}"></div><div><label>Modalidade</label><select id="fm">${opt(['Muay Thai','Jiu-Jitsu','Boxe','Kickboxing','MMA','Outra'],s.mod)}</select></div>
  <div><label>Plano</label><select id="fp">${opt(Object.keys(PL),s.plano)}</select></div><div><label>Valor (R$)</label><input id="fv" inputmode="decimal" value="${s.valor||''}"></div>
  <div><label>Próximo vencimento (editável)</label><input id="fd" type="date" value="${pp?.due||''}"></div><div><label>Forma de pagamento</label><select id="ff">${opt(['Pix','Dinheiro','Cartão','Transferência'],s.forma)}</select></div>
  <div class="f"><label>Observações</label><textarea id="fo" rows="2">${esc(s.obs)}</textarea></div></div>
  <div class="dlg-acts"><button class="b" data-a="close">Cancelar</button><button class="b pri" data-a="save" data-id="${id||''}">Salvar aluno</button></div>`;
  const rec=()=>{if(!$('#fd').dataset.m&&!id)$('#fd').value=addM($('#fe').value,PL[$('#fp').value])};$('#fe').onchange=rec;$('#fp').onchange=rec;$('#fd').oninput=e=>e.target.dataset.m=1;if(!id)rec();$('#dlg').showModal()}

function saveAluno(id){const g=i=>$('#'+i).value.trim(),nome=g('fn'),tel=g('ft'),v=g('fv').replace(',','.'),due=g('fd');
  if(!nome||tel.replace(/\D/g,'').length<10||!(Number(v)>0)||!due){toast('Preencha nome, WhatsApp válido, valor e vencimento.');return}
  const o={nome,tel,nasc:g('fb'),entrada:g('fe'),mod:g('fm'),plano:g('fp'),valor:Number(v),forma:g('ff'),obs:g('fo')};
  if(id){Object.assign(stu(id),o);const p=P.find(p=>p.sid===id&&!p.paidAt);if(p){if(p.due!==due)(p.h=p.h||[]).push('vencimento '+fd(p.due)+' para '+fd(due));p.due=due;p.valor=o.valor}}
  else{const n={id:uid(),status:'ativo',...o};S.push(n);P.push({id:uid(),sid:n.id,due,valor:o.valor,paidAt:null,h:[]})}
  sv();$('#dlg').close();toast('Aluno salvo');go(view)}

function pay(id){const p=P.find(x=>x.id===id),s=stu(p.sid);p.paidAt=todayS();(p.h=p.h||[]).push('pago em '+fd(p.paidAt));P.push({id:uid(),sid:s.id,due:addM(p.due,PL[s.plano]),valor:s.valor,paidAt:null,h:[]});sv();toast('Pagamento de '+s.nome.split(' ')[0]+' registrado');go(view)}

document.addEventListener('click',e=>{
  const l=e.target.closest('[data-log]');if(l){const[pid,rule]=l.dataset.log.split('|'),p=P.find(x=>x.id===pid);L.push({pid,rule,nome:stu(p.sid).nome,at:Date.now()});sv();setTimeout(()=>go(view),300);return}
  const n=e.target.closest('[data-v]');if(n)return go(n.dataset.v);const f=e.target.closest('[data-f]');if(f){filt=f.dataset.f;return go('mensalidades')}
  const a=e.target.closest('[data-a]');if(!a)return;const id=a.dataset.id,k=a.dataset.a;
  if(k==='new')formAluno();else if(k==='edit')formAluno(id);else if(k==='close')$('#dlg').close();else if(k==='save')saveAluno(id);else if(k==='pay')pay(id);
  else if(k==='tog'){const s=stu(id);s.status=s.status==='ativo'?'pausado':'ativo';sv();toast(s.status==='ativo'?'Aluno reativado':'Aluno pausado');go(view)}
  else if(k==='del'){if(confirm('Excluir '+stu(id).nome+' e todo o histórico?')){S=S.filter(s=>s.id!==id);P=P.filter(p=>p.sid!==id);sv();toast('Aluno excluído');go(view)}}
  else if(k==='savecfg'){C.academia=$('#ac').value.trim()||'Minha Academia';C.pix=$('#px').value.trim();sv();toast('Configurações salvas');go(view)}
  else if(k==='reset'){if(confirm('Apagar TODOS os dados?')){localStorage.clear();location.reload()}}
  else if(k==='csv'){const rows=[['Aluno','Modalidade','Valor','Vencimento','Pagamento','Status']].concat(P.filter(p=>stu(p.sid)).map(p=>[stu(p.sid).nome,stu(p.sid).mod,p.valor,p.due,p.paidAt||'',st(p)[1]]));const b=new Blob(['﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'});const u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='fightflow.csv';x.click()}});
document.addEventListener('input',e=>{if(e.target.id==='tpl'){C.tpl=e.target.value;sv();const p=open()[0];if(p)$('#pv').textContent=msg(p)}if(e.target.dataset.r){C.rules[e.target.dataset.r]=e.target.checked;sv()}});
function go(v){view=v;$('#nav').innerHTML=NAV.map(([k,t,sh])=>`<button data-v="${k}" class="${k===v?'on':''}" aria-label="${t}"${k===v?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg><span class="t">${t}</span><span class="s">${sh}</span></button>`).join('');
  $('#acad').textContent=C.academia;const n=open().filter(p=>diff(p.due)<=0).length;$('#alertN').textContent=n?n+' para cobrar':'';
  $('#v').innerHTML={dashboard:dash,alunos,mensalidades:mens,cobrancas:cobr,automacoes:auto,relatorios:rel,config:cfg}[v]();window.scrollTo(0,0)}
{const src=$('#logoimg').src;$('#mlogo').src=src;$('#fav').href=src;$('#ati').href=src}
go('dashboard');
</script>
</body>
</html>
